<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Settings | Unlock The Mystery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0d17;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            background: #111522;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav strong {
            color: #c084fc;
            font-size: 20px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #c084fc;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #d084fc;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        .card {
            background: #151927;
            border: 1px solid #4b3670;
            border-radius: 16px;
            padding: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #ddd;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0d101b;
            color: white;
            border: 1px solid #4b4160;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: #c084fc;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

    </style>

</head>

<body>

    <nav>

        <strong>
            🔐 UNLOCK THE MYSTERY
        </strong>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/admin">
                Admin Panel
            </a>

        </div>

    </nav>


    <main class="container">

        <h1>
            ⚙️ ADMIN SETTINGS
        </h1>

        <p class="subtitle">
            Change your admin account details
        </p>


        <div class="card">

            <form id="settingsForm">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter admin name"
                >


                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                >


                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                >


                <button type="submit">
                    💾 SAVE CHANGES
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>

        </div>


        <a
            href="/admin"
            class="back"
        >
            ← BACK TO ADMIN PANEL
        </a>

    </main>


    <script>

        async function loadCurrentAdmin() {

            try {

                const response =
                    await fetch(
                        "/api/current-user"
                    );

                const user =
                    await response.json();

                if (!response.ok) {

                    alert(
                        user.message ||
                        "Please login as admin."
                    );

                    window.location.href =
                        "/login";

                    return;
                }

                if (user.role !== "admin") {

                    alert(
                        "Only admin can access settings."
                    );

                    window.location.href =
                        "/admin";

                    return;
                }

                document.getElementById(
                    "name"
                ).value =
                    user.name || "";

                document.getElementById(
                    "username"
                ).value =
                    user.username || "";

            } catch (error) {

                console.log(error);

            }

        }


        document.getElementById(
            "settingsForm"
        ).addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();

                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value.trim();


                if (!name || !username) {

                    alert(
                        "Name and username are required."
                    );

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/admin/settings",
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name:
                                            name,
                                        username:
                                            username,
                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    const message =
                        document.getElementById(
                            "message"
                        );


                    if (!response.ok) {

                        message.style.display =
                            "block";

                        message.innerHTML =
                            "❌ " +
                            (
                                data.message ||
                                "Could not update settings."
                            );

                        return;
                    }


                    message.style.display =
                        "block";

                    message.innerHTML =
                        "✅ " +
                        data.message;


                    document.getElementById(
                        "password"
                    ).value = "";


                } catch (error) {

                    console.log(error);

                    alert(
                        "Could not update settings."
                    );

                }

            }
        );


        loadCurrentAdmin();

    </script>

</body>

</html>
