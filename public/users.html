<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users | Unlock The Mystery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0d17;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            background: #111522;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav strong {
            color: #c084fc;
            font-size: 20px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #c084fc;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #d084fc;
            font-size: 40px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        .table-box {
            background: #151927;
            border: 1px solid #4b3670;
            border-radius: 16px;
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #8b5cf6;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #30283d;
            color: #ddd;
        }

        tr:hover {
            background: #1c2030;
        }

        .role {
            padding: 6px 12px;
            border-radius: 15px;
            background: #302044;
            color: #d8b4fe;
        }

        .score {
            color: #facc15;
            font-weight: bold;
        }
        .delete-btn {
    padding: 8px 14px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.delete-btn:hover {
    background: #dc2626;
}

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 22px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

    </style>

</head>


<body>


    <nav>

        <strong>
            🔐 UNLOCK THE MYSTERY
        </strong>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/admin">
                Admin Panel
            </a>

            <a href="/leaderboard">
                Leaderboard
            </a>

        </div>

    </nav>


    <main class="container">


        <h1>
            👥 MANAGE USERS
        </h1>

        <p class="subtitle">
            View registered players and their details
        </p>


        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Username
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Score
                        </th>
                        <th>
                            Action
                        </th>
                    </tr>

                </thead>


                <tbody id="usersTable">

                    <tr>

                        <td colspan="6"
                            class="message">

                            Loading users...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <div style="text-align:center;">

            <a
                href="/admin"
                class="back"
            >
                ← BACK TO ADMIN PANEL
            </a>

        </div>


    </main>


    <script>

        async function loadUsers() {

            try {

                const response =
                    await fetch("/api/users");

                const users =
                    await response.json();


                const table =
                    document.getElementById(
                        "usersTable"
                    );


                if (
                    !users ||
                    users.length === 0
                ) {

                    table.innerHTML = `
                        <tr>
                            <td
                                colspan="6"
                                class="message"
                            >
                                No users found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                table.innerHTML =
                    users.map(user => `

                        <tr>

                            <td>
                                ${user.id}
                            </td>

                            <td>
                                ${user.name}
                            </td>

                            <td>
                                ${user.username}
                            </td>

                            <td>
                                <span class="role">
                                    ${user.role}
                                </span>
                            </td>

                            <td class="score">
                                ⭐ ${user.score || 0}
                            </td>
                            <td>
                              ${
                                 user.role === "admin"
                                 ? "🔒 Protected"
                                 : `
                                  <button
                                    class="delete-btn"
                                    onclick="deleteUser(${user.id})"
                                  >
                                    🗑️ Delete
                                  </button>
        `
                               }
                            </td>

                        </tr>

                    `).join("");


            } catch (error) {

                document.getElementById(
                    "usersTable"
                ).innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="message"
                        >
                            ❌ Could not load users.
                        </td>

                    </tr>

                `;

            }

        }
async function deleteUser(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this user?"
        );

    if (!confirmDelete) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/users/" + id,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Could not delete user."
            );

            return;
        }

        alert(
            "User deleted successfully!"
        );

        loadUsers();

    } catch (error) {

        console.log(error);

        alert(
            "Could not delete user."
        );
    }
}

        loadUsers();

    </script>


</body>

</html>
