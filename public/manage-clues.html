<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Clues | Unlock The Mystery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08000f;
            color: white;
            min-height: 100vh;
        }

        nav {
            padding: 22px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3b174c;
        }

        nav strong {
            color: #ff66d9;
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff66d9;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #ff66d9;
            font-size: 40px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #ddd;
            margin-bottom: 35px;
        }

        .selector {
            background: #14051d;
            border: 1px solid #5c2670;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #24102e;
            color: white;
            font-size: 16px;
        }

        .clue-card {
            background: #14051d;
            border: 1px solid #512361;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .clue-number {
            display: inline-block;
            background: #c64cff;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question {
            font-size: 20px;
            color: #ff8de5;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .answer,
        .hint,
        .points {
            color: #ddd;
            margin: 8px 0;
        }

        .buttons {
            margin-top: 18px;
        }

        button {
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
            color: white;
        }

        .edit {
            background: #b94cff;
        }

        .delete {
            background: #e83d8c;
        }

        .add {
            background: #ff55c8;
            display: block;
            margin: 0 auto 30px;
            font-size: 16px;
            padding: 13px 25px;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #ccc;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 35px auto;
            color: #ff66d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <strong>🔐 UNLOCK THE MYSTERY</strong>

    <div>
        <a href="/">Home</a>
        <a href="/manage-hunts">Hunts</a>
        <a href="/leaderboard">Leaderboard</a>
    </div>
</nav>

<main class="container">

    <h1>🧩 MANAGE CLUES</h1>

    <p class="subtitle">
        View and manage clues for every mystery hunt.
    </p>

    <button class="add" onclick="addClue()">
        + ADD NEW CLUE
    </button>

    <div class="selector">
        <label for="huntSelect">
            Select Hunt
        </label>

        <select id="huntSelect" onchange="loadClues()">
            <option value="">-- Select a Hunt --</option>
        </select>
    </div>

    <div id="cluesContainer">
        <div class="message">
            Select a hunt to view its clues.
        </div>
    </div>

    <a href="/admin" class="back">
        ← BACK TO ADMIN PANEL
    </a>

</main>

<script>

async function loadHunts() {

    try {

        const response =
            await fetch("/api/hunts");

        const hunts =
            await response.json();

        const select =
            document.getElementById("huntSelect");

        select.innerHTML =
            '<option value="">-- Select a Hunt --</option>';

        hunts.forEach(hunt => {

            const option =
                document.createElement("option");

            option.value = hunt.id;

            option.textContent =
                hunt.title;

            select.appendChild(option);

        });

    } catch (error) {

        console.log(error);

        document.getElementById("cluesContainer")
            .innerHTML = `
                <div class="message">
                    ❌ Could not load hunts.
                </div>
            `;
    }
}


async function loadClues() {

    const huntId =
        document.getElementById("huntSelect").value;

    const container =
        document.getElementById("cluesContainer");

    if (!huntId) {

        container.innerHTML = `
            <div class="message">
                Select a hunt to view its clues.
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="message">
            Loading clues...
        </div>
    `;

    try {

        const response =
            await fetch(
                "/api/clues?huntId=" + huntId
            );

        const clues =
            await response.json();

        if (!Array.isArray(clues) || clues.length === 0) {

            container.innerHTML = `
                <div class="message">
                    No clues found for this hunt.
                </div>
            `;

            return;
        }

        container.innerHTML =
            clues.map((clue, index) => `

                <div class="clue-card">

                    <div class="clue-number">
                        Level ${index + 1}
                    </div>

                    <div class="question">
                        ${escapeHTML(clue.question || "")}
                    </div>

                    <div class="answer">
                        <strong>Answer:</strong>
                        ${escapeHTML(clue.answer || "")}
                    </div>

                    <div class="hint">
                        <strong>Hint:</strong>
                        ${escapeHTML(clue.hint || "No hint")}
                    </div>

                    <div class="points">
                        <strong>Points:</strong>
                        ${clue.points || 0}
                    </div>

                    <div class="buttons">

                        <button
                            class="edit"
                            onclick="editClue(${clue.id})">
                            EDIT
                        </button>

                        <button
                            class="delete"
                            onclick="deleteClue(${clue.id})">
                            DELETE
                        </button>

                    </div>

                </div>

            `).join("");

    } catch (error) {

        console.log(error);

        container.innerHTML = `
            <div class="message">
                ❌ Could not load clues.
            </div>
        `;
    }
}

function addClue() {

    const huntId =
        document.getElementById("huntSelect").value;

    if (!huntId) {
        alert("Please select a hunt first.");
        return;
    }

    const question =
        prompt("Enter clue question:");

    if (!question) {
        return;
    }

    const answer =
        prompt("Enter correct answer:");

    if (!answer) {
        return;
    }

    const hint =
        prompt("Enter hint:");

    const pointsInput =
        prompt("Enter points:", "20");

    const points =
        Number(pointsInput) || 20;


    fetch("/api/clues", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            huntId: Number(huntId),

            question: question,

            answer: answer,

            hint: hint || "",

            points: points

        })

    })
    .then(async response => {

        const text =
            await response.text();

        console.log(
            "SERVER STATUS:",
            response.status
        );

        console.log(
            "SERVER RESPONSE:",
            text
        );

        let data = {};

        try {
            data = JSON.parse(text);
        } catch (error) {
            data = {
                message: text
            };
        }

        if (!response.ok) {

            alert(
                data.message ||
                "Server rejected the clue."
            );

            return null;
        }

        return data;
    })
    .then(data => {

        if (!data) {
            return;
        }

        alert(
            "Clue added successfully!"
        );

        loadClues(huntId);

    })
    .catch(error => {

        console.log(
            "ADD CLUE ERROR:",
            error
        );

        alert(
            "Could not add clue. Check browser console."
        );
    });
}


function editClue(id) {

    const huntId =
        document.getElementById("huntSelect").value;

    if (!huntId) {
        alert("Please select a hunt first.");
        return;
    }

    const question =
        prompt("Enter new clue question:");

    if (!question) {
        return;
    }

    const answer =
        prompt("Enter new correct answer:");

    if (!answer) {
        return;
    }

    const hint =
        prompt("Enter new hint:");

    const pointsInput =
        prompt("Enter points:", "20");

    const points =
        Number(pointsInput) || 20;


    fetch("/api/clues/" + id, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            huntId: Number(huntId),

            question: question,

            answer: answer,

            hint: hint || "",

            points: points

        })

    })
    .then(response =>
        response.json()
            .then(data => ({
                ok: response.ok,
                data: data
            }))
    )
    .then(result => {

        if (!result.ok) {

            alert(
                result.data.message ||
                "Could not update clue."
            );

            return;
        }

        alert(
            "Clue updated successfully!"
        );

        loadClues(huntId);

    })
    .catch(error => {

        console.log(
            "EDIT CLUE ERROR:",
            error
        );

        alert(
            "Could not update clue."
        );
    });
}


function deleteClue(id) {

    const huntId =
        document.getElementById("huntSelect").value;

    if (!huntId) {
        alert("Please select a hunt first.");
        return;
    }

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this clue?"
        );

    if (!confirmDelete) {
        return;
    }

    fetch(
        "/api/clues/" +
        id +
        "?huntId=" +
        huntId,
        {
            method: "DELETE"
        }
    )
    .then(response =>
        response.json()
            .then(data => ({
                ok: response.ok,
                data: data
            }))
    )
    .then(result => {

        if (!result.ok) {

            alert(
                result.data.message ||
                "Could not delete clue."
            );

            return;
        }

        alert(
            "Clue deleted successfully!"
        );

        loadClues(huntId);

    })
    .catch(error => {

        console.log(
            "DELETE CLUE ERROR:",
            error
        );

        alert(
            "Could not delete clue."
        );
    });
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadHunts();

</script>

</body>
</html>
