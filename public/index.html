<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unlock The Mystery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        nav {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
            background: #111522;
            border-bottom: 1px solid #292d42;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #a78bfa;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #a78bfa;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;

            background:
                linear-gradient(rgba(11, 13, 23, 0.75),
                rgba(11, 13, 23, 0.95)),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23")
                center/cover;
        }

        .hero-content {
            max-width: 850px;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid #8b5cf6;
            border-radius: 30px;
            color: #c4b5fd;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 85px);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        h1 span {
            color: #a78bfa;
        }

        .subtitle {
            font-size: 25px;
            margin-bottom: 15px;
        }

        .tagline {
            color: #c7c9d3;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .primary {
            background: #8b5cf6;
            color: white;
        }

        .primary:hover {
            background: #7c3aed;
            transform: translateY(-3px);
        }

        .secondary {
            border: 1px solid #8b5cf6;
            color: white;
        }

        .secondary:hover {
            background: #8b5cf6;
        }

        .mystery {
            margin-top: 55px;
            color: #aaaec0;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .nav-links {
                display: none;
            }

            .hero {
                min-height: calc(100vh - 70px);
            }

            .subtitle {
                font-size: 20px;
            }

            .tagline {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🔐 UNLOCK THE MYSTERY</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/hunts">Hunts</a>
            <a href="/login">Login</a>
        </div>
    </nav>


    <section class="hero">

        <div class="hero-content">

            <div class="badge">
                🗝️ A Virtual Treasure Hunt
            </div>

            <h1>
                UNLOCK <span>THE MYSTERY</span>
            </h1>

            <p class="subtitle">
                A Virtual Treasure Hunt System
            </p>

            <p class="tagline">
                Find the Clue. Solve the Mystery. Unlock the Treasure.
            </p>

            <div class="buttons">

                <a href="/hunts" class="btn primary">
                    🔎 START HUNT
                </a>

                <a href="/hunts" class="btn secondary">
                    🗺️ EXPLORE HUNTS
                </a>

            </div>

            <div class="mystery">
                ✦ Every clue hides a secret. Every answer brings you closer to the treasure. ✦
            </div>

        </div>

    </section>

</body>

</html>
