<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Unlock The Mystery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0d17;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 430px;
            background: #151927;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #8b5cf6;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0d101b;
            color: white;
            border: 1px solid #4b4160;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .register a {
            color: #c084fc;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="box">

        <div class="logo">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to continue your mystery
        </p>


        <form method="POST" action="/login">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                🔓 LOGIN
            </button>

        </form>


        <div class="register">
            Don't have an account?
            <a href="/register">
                Register
            </a>
        </div>


        <a class="home" href="/">
            ← Back to Home
        </a>

    </div>

</body>

</html>
