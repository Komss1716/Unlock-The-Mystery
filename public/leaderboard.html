<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Leaderboard | Unlock The Mystery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0d17;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            background: #111522;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #c084fc;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading .icon {
            font-size: 65px;
        }

        h1 {
            color: #c084fc;
            font-size: 42px;
            margin: 15px 0 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 17px;
        }

        .board {
            background: #151927;
            border: 1px solid #51358a;
            border-radius: 20px;
            padding: 25px;
            overflow-x: auto;
        }

        .row {
            display: grid;
            grid-template-columns: 80px 1fr 180px;
            align-items: center;
            padding: 20px;
            margin-bottom: 10px;
            background: #0f1320;
            border-radius: 12px;
        }

        .row.header {
            background: #8b5cf6;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .rank {
            font-size: 22px;
            text-align: center;
        }

        .player {
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            text-align: right;
            color: #facc15;
            font-weight: bold;
            font-size: 18px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .back:hover {
            background: #7c3aed;
        }

        @media(max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            nav a {
                margin-left: 10px;
            }

            h1 {
                font-size: 32px;
            }

            .row {
                grid-template-columns: 60px 1fr 100px;
                padding: 15px 10px;
            }

            .player {
                font-size: 15px;
            }

            .score {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div>

            🔐
            <strong>
                UNLOCK THE MYSTERY
            </strong>

        </div>


        <div>

            <a href="/">
                Home
            </a>

            <a href="/hunts">
                Hunts
            </a>

            <a href="/leaderboard">
                Leaderboard
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="heading">

            <div class="icon">
                🏆
            </div>

            <h1>
                LEADERBOARD
            </h1>

            <p class="subtitle">
                The best mystery solvers
            </p>

        </div>


        <div class="board">

            <div class="row header">

                <div class="rank">
                    Rank
                </div>

                <div>
                    Player
                </div>

                <div class="score">
                    Score
                </div>

            </div>


            <div id="leaderboard">

                <div class="empty">
                    Loading leaderboard...
                </div>

            </div>

        </div>


        <div style="text-align:center;">

            <a
                class="back"
                href="/hunts"
            >
                🔎 PLAY A HUNT
            </a>

        </div>

    </main>


    <script>

        async function loadLeaderboard() {

            try {

                const response =
                    await fetch(
                        "/api/leaderboard"
                    );

                const players =
                    await response.json();

                const container =
                    document.getElementById(
                        "leaderboard"
                    );


                if (
                    !players ||
                    players.length === 0
                ) {

                    container.innerHTML = `
                        <div class="empty">
                            No scores available yet.
                        </div>
                    `;

                    return;
                }


                container.innerHTML =
                    players
                        .map(
                            (player, index) => {

                                let medal = "";

                                if (index === 0) {
                                    medal = "🥇";
                                }
                                else if (index === 1) {
                                    medal = "🥈";
                                }
                                else if (index === 2) {
                                    medal = "🥉";
                                }
                                else {
                                    medal =
                                        index + 1;
                                }


                                return `

                                    <div class="row">

                                        <div class="rank">
                                            ${medal}
                                        </div>

                                        <div class="player">
                                            ${player.name}
                                        </div>

                                        <div class="score">
                                            ⭐ ${player.score}
                                        </div>

                                    </div>

                                `;

                            }
                        )
                        .join("");

            }
            catch (error) {

                document
                    .getElementById(
                        "leaderboard"
                    )
                    .innerHTML = `
                        <div class="empty">
                            Unable to load leaderboard.
                        </div>
                    `;

            }

        }


        loadLeaderboard();

    </script>

</body>

</html>
