<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Unlock The Mystery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0d17;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 430px;
            background: #151927;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #8b5cf6;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0d101b;
            color: white;
            border: 1px solid #4b4160;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .login a {
            color: #c084fc;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .error {
            color: #fb7185;
            font-size: 14px;
            margin-top: -12px;
            margin-bottom: 15px;
            display: none;
        }

    </style>

</head>


<body>

    <div class="box">

        <div class="logo">
            🔐
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join the mystery adventure
        </p>

<form
    method="POST"
    action="/register"
    id="registerForm"
    onsubmit="return validateRegisterForm()"
>
            <!-- NAME -->

            <label>
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
                autocomplete="name"
                pattern="[A-Za-z ]+"
                title="Name can contain only A-Z letters and spaces."
            >

            <div
                class="error"
                id="nameError"
            >
                ❌ Name can contain only A-Z letters.
            </div>


            <!-- USERNAME -->

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Create username"
                required
                autocomplete="username"
                pattern="[a-z0-9_]+"
                title="Username must contain lowercase letters, numbers or underscore only."
            >

            <div
                class="error"
                id="usernameError"
            >
                ❌ Username can contain only lowercase letters, numbers and underscore.
            </div>


            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
                autocomplete="new-password"
            >


            <button type="submit">
                📝 REGISTER
            </button>

        </form>


        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


        <a class="home" href="/">
            ← Back to Home
        </a>

    </div>


    <script>

        const nameInput =
            document.getElementById("name");

        const usernameInput =
            document.getElementById("username");

        const nameError =
            document.getElementById("nameError");

        const usernameError =
            document.getElementById("usernameError");


        // ===============================
        // NAME VALIDATION
        // ===============================

        nameInput.addEventListener(
            "input",
            function () {

                // Only A-Z letters and spaces
                this.value =
                    this.value.replace(
                        /[^A-Za-z ]/g,
                        ""
                    );

                // Remove extra spaces
                this.value =
                    this.value.replace(
                        /\s+/g,
                        " "
                    );

                if (
                    this.value &&
                    !/^[A-Za-z ]+$/.test(
                        this.value
                    )
                ) {

                    nameError.style.display =
                        "block";

                } else {

                    nameError.style.display =
                        "none";
                }

            }
        );


        // ===============================
        // USERNAME
        // ===============================

        usernameInput.addEventListener(
            "input",
            function () {

                // Automatically convert to lowercase
                this.value =
                    this.value.toLowerCase();

                // Remove spaces and invalid symbols
                this.value =
                    this.value.replace(
                        /[^a-z0-9_]/g,
                        ""
                    );

                if (
                    this.value &&
                    !/^[a-z0-9_]+$/.test(
                        this.value
                    )
                ) {

                    usernameError.style.display =
                        "block";

                } else {

                    usernameError.style.display =
                        "none";
                }

            }
        );


        // ===============================
        // FORM VALIDATION
        // ===============================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                function (event) {

                    const name =
                        nameInput.value.trim();

                    const username =
                        usernameInput.value.trim();


                    if (
                        !/^[A-Za-z ]+$/.test(name)
                    ) {

                        event.preventDefault();

                        alert(
                            "Name can contain only A-Z letters and spaces."
                        );

                        nameInput.focus();

                        return;
                    }


                    if (
                        !/^[a-z0-9_]+$/.test(
                            username
                        )
                    ) {

                        event.preventDefault();

                        alert(
                            "Username must use lowercase letters, numbers or underscore only."
                        );

                        usernameInput.focus();

                        return;
                    }

                }
            );

    </script>
<script>

function validateRegisterForm() {

    const name =
        document.getElementById("name").value.trim();

    const usernameInput =
        document.getElementById("username");

    const username =
        usernameInput.value.trim();

    // NAME: Only A-Z letters and spaces
    if (!/^[A-Za-z ]+$/.test(name)) {

        alert(
            "Name can contain only A-Z letters."
        );

        return false;
    }

    // USERNAME: Convert to lowercase
    usernameInput.value =
        username.toLowerCase();

    // USERNAME: Only lowercase letters, numbers and underscore
    if (!/^[a-z0-9_]+$/.test(
        usernameInput.value
    )) {

        alert(
            "Username can contain only lowercase letters, numbers and underscore."
        );

        return false;
    }

    return true;
}

</script>
</body>

</html>
